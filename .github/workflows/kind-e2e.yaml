name: e2e

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  kind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Keep running if one leg fails.
      matrix:
        k8s-version:
        - v1.27.x
        - v1.28.x
        ingress:
        - istio
        - contour

    env:
      KO_DOCKER_REPO: kind.local
      # Use a semi-random cluster suffix, but somewhat predictable
      # so reruns don't just give us a completely new value.
      CLUSTER_SUFFIX: c${{ github.run_id }}.local

    steps:

    - name: Set up Go 1.21.x
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: 1.27.x

    - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

    - name: Setup KinD
      uses: chainguard-dev/actions/setup-kind@main
      with:
        k8s-version: ${{ matrix.k8s-version }}
        kind-worker-count: 3

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: test
      run: |
        ./test/e2e-tests.sh \
          --${{ matrix.ingress }} \
          --run-tests \
          --kind \
          --skip-dump-on-failure

    - uses: chainguard-dev/actions/kind-diag@main
      if: ${{ failure() }}
      with:
        cluster-resources: nodes,namespaces,crds,gatewayclass
        namespace-resources: pods,svc,king,gateway,httproute,referencegrant,tcproute,tlsroute,udproute
        artifact-name: logs-${{ matrix.k8s-version}}-${{ matrix.ingress }}

    - name: Post failure notice to Slack
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
      if: ${{ failure() && github.event_name != 'pull_request' }}
      env:
        SLACK_ICON: http://github.com/knative.png?size=48
        SLACK_USERNAME: github-actions
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

        SLACK_CHANNEL: 'net-gateway-api'
        SLACK_COLOR: '#8E1600'
        MSG_MINIMAL: 'true'
        SLACK_TITLE: Periodic ${{ matrix.k8s-version }} failed.
        SLACK_MESSAGE: |
          For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
